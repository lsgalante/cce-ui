[package]
name = "cce-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "cce_ui"
path = "src/lib.rs"

[lints.clippy]
# House style, not defects (CI runs clippy with warnings as errors; anything not listed here
# is fixed, not allowed):
# - the paint and tessellation functions take geometry and colour piecewise;
too_many_arguments = "allow"
# - the legacy tuple views (`(f32, f32, f32, f32, [f32; 4])` quads and friends);
type_complexity = "allow"
# - colour and curve constants are written as their specs give them;
excessive_precision = "allow"
# - geometry loops index several arrays in step;
needless_range_loop = "allow"
# - a widget's `new` returns `Adapted<Self>`, which a `Default` would not.
new_without_default = "allow"

[features]
# `widget::markdown` (MarkdownView): lays out vault notes for reading views
# and note cards. Brings in cce-vault and its Markdown parser, so only the
# clients that show notes turn it on.
markdown = ["dep:cce-vault"]
# `widget::doc_editor` (DocEditor): the line-buffer document editor with
# Markdown live preview (cce-notes' editing mode). No extra dependencies.
doc_editor = []
# Publish each window's accessibility tree to screen readers through AT-SPI
# (accesskit_unix, in the Wayland shell; rfc-accessibility-locale phase 2). An
# app must still opt in at run time (`Application::publishes_accessibility`, or
# CCE_A11Y=1), since a workspace build turns a feature on for every app at once.
a11y = ["dep:accesskit_unix"]

[dependencies]
# The GUI-free half: config, input, motion, units, ipc and the spec parsers,
# re-exported at their old paths (`cce_ui::config`, …). See lib.rs.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14", features = ["l10n"] }
# The accessibility tree's schema (rfc-accessibility-locale § 5): pure data, built for
# every target; `crate::a11y` produces its TreeUpdate. The platform adapters are separate.
accesskit = "0.25"
# Calendar dates for `DatePicker`: `NaiveDate` arithmetic only. No default features, so no
# clock and nothing platform-bound — the picker is handed "today" by its host.
chrono = { version = "0.4", default-features = false }
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "3a7348a77ea6381d63b7358d14baf155637a7e38", optional = true }
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
# WGSL parsing and validation everywhere — a compute kernel is checked, and
# its `@workgroup_size` read, before any device sees it; native adds the
# SPIR-V writer below.
naga = { version = "24", features = ["wgsl-in"] }
# Text shaping. This was reached through glyphon until the wgpu path was retired;
# every `glyphon::` item cce-ui ever used was a cosmic-text re-export (the sole
# exception, `TextBounds`, is now defined in backend/text.rs), so depending
# on cosmic-text directly drops glyphon, wgpu and 17 more crates from the build —
# the rest of wgpu's tree stays only because naga/ash below already pull it.
# Pinned to the exact version glyphon 0.8 resolved to, so shaping does not change:
# verified by diffing shaped glyph ids/advances both ways over 288 runs.
cosmic-text = "=0.12.1"
# A paragraph's base direction and the reordering of styled runs (accessibility RFC phase 4).
# Already in the tree through cosmic-text, which shapes with it.
unicode-bidi = { version = "0.3.13", default-features = false, features = ["hardcoded-data"] }
bitflags = "2"
# The cursor names an app returns. smithay-client-toolkit re-exports this same
# crate's type, so the Wayland shell hands it over unconverted; depending on it
# directly keeps the client contract free of the toolkit.
cursor-icon = "1.2"
resvg = "0.41.0"
# App/tray icon themes are overwhelmingly PNG; resvg covers only the SVG half.
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kdl = "4.6"
log = "0.4"
# `Instant` that works in the browser: std's panics on wasm32-unknown-unknown,
# which has no clock of its own. On every other target this IS std's.
web-time = "1"

# The native shell and renderer: Wayland through smithay-client-toolkit on a
# calloop loop, Vulkan through ash. None of it builds for the browser, where
# the shell and renderer are the web platform's (`cargo check --lib --target
# wasm32-unknown-unknown` is the check that keeps the rest portable).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
raw-window-handle = "0.6"
# Raw-Vulkan backend (versions match what wgpu 24 already pulled in).
ash = "0.38"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
naga = { version = "24", features = ["wgsl-in", "spv-out"] }
libc = "0.2"
rfd = "0.15"

# The Wayland shell: every native target but macOS, which has its own shell
# (`src/mac`, AppKit) over the same Vulkan renderer through MoltenVK.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "macos")))'.dependencies]
smithay-client-toolkit = { version = "0.19.2", features = ["calloop"] }
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-backend = "0.3"
wayland-scanner = "0.31"
xkeysym = "0.2"
accesskit_unix = { version = "0.24", optional = true }

# The AppKit shell (`src/mac`): the window, its CAMetalLayer, the run loop.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSNotification", "NSObject", "NSDate", "NSDictionary", "NSArray", "NSAttributedString", "NSRange", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSEvent", "NSScreen", "NSCursor", "NSMenu", "NSMenuItem", "NSPasteboard", "NSTextInputClient", "NSTextInputContext", "NSColor", "NSTrackingArea", "NSGraphics", "NSGraphicsContext", "NSRunningApplication", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation"] }
dispatch2 = "0.3"

# The browser shell and renderer (W2/W3 of the web port): WebGPU through
# web-sys, the page through wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
