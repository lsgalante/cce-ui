# The renderer probe: one scene through both renderers (examples/probe/).
# probe_web is the browser half, a cdylib for wasm-bindgen; natively it is empty.
[[example]]
name = "probe_web"
crate-type = ["cdylib"]

# The 3D probe's browser half (examples/probe3d/); empty natively.
[[example]]
name = "probe3d_web"
crate-type = ["cdylib"]

# The compute probe's browser half (examples/compute_probe/); empty natively.
[[example]]
name = "compute_web"
crate-type = ["cdylib"]

# The reference app (src/main.rs) in a browser, on the browser shell; a
# cdylib for wasm-bindgen, empty natively.
[[example]]
name = "demo_web"
crate-type = ["cdylib"]

[dev-dependencies]
# The same crate with its `cfg(test)` behaviour switched on, so this suite reads
# no machine config now that config/input/motion live there (cce-core's
# `test-isolation`; resolver 2 keeps it out of normal builds).
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14", features = ["test-isolation"] }

[build-dependencies]
# build.rs compiles the fixed WGSL shaders to SPIR-V once, instead of in every
# process that builds a renderer. Same version as the runtime dependency above,
# which still compiles the shaders made at run time.
naga = { version = "24", features = ["wgsl-in", "spv-out"] }
