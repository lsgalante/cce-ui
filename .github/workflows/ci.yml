name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The tree builds without warnings; keep it that way. (Dependencies are
  # capped by cargo and unaffected.)
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCE_FONTS_DIR: /usr/share/fonts/truetype/liberation
    steps:
      - uses: actions/checkout@v5

      # libwayland-dev, libxkbcommon-dev: the two native libraries the build
      # links, found through pkg-config (wayland-sys, smithay-client-toolkit).
      # mesa-vulkan-drivers: lavapipe, a software Vulkan device, so the GPU
      # tests (vk::compute, vk::plate_probe) run instead of skipping.
      # fonts-liberation: a known face set (sans, serif, mono, each with its
      # italic) for the text tests, handed over as CCE_FONTS_DIR below. With
      # none, the font system fell back to whatever the runner image carries,
      # and the tests that need a second face or a fallback glyph failed —
      # which kept this workflow red from 2026-10-07 on.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers \
            fonts-liberation

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Test (default features)
        run: cargo test

      # `markdown` pulls cce-vault (a public git dependency); `doc_editor`
      # has none.
      - name: Test (all features)
        run: cargo test --all-features

      # The path tracer's GPU tests are #[ignore]d for machines without a
      # device; lavapipe has one, and its compute tier is what every Vulkan
      # device without RT cores (and WebGPU) runs.
      - name: Path tracer GPU tests (compute tier)
        run: CCE_VK_RT=compute cargo test --lib vk::rt -- --ignored

      # The GPU tests skip with a note when no Vulkan device opens, and a
      # skipped test passes. Fail instead if they skipped here, so losing
      # lavapipe does not quietly drop the only rendered checks.
      - name: GPU tests ran on a real device
        shell: bash
        run: |
          cargo test --lib vk:: -- --nocapture 2>&1 | tee vk-tests.log
          if grep -i "skipping" vk-tests.log; then
            echo "::error::the Vulkan tests skipped: no device opened on the runner"
            exit 1
          fi

  # Clippy over every target and feature, warnings as errors. The few lints the
  # crate allows are house style, listed with their reasons in Cargo.toml's
  # [lints.clippy]; anything else is fixed. Linux only: src/web and src/mac are
  # cfg'd out here, as in the test job.
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The registry's own widgets, under Miri: the aliasing rules a compiler does not check.
  # The context owns every widget as a raw root and lends it out; these tests take turns
  # between an app's access by handle, the context's dispatch, a lent widget reaching back,
  # and embedded children moving in and out, under both of Miri's aliasing models. Narrow
  # on purpose (Miri interprets, slowly).
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # A nightly may warn where stable does not; this job is about aliasing, not lints.
      RUSTFLAGS: ""
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - name: Stacked Borrows
        run: cargo miri test --lib -- widget::handle widget::embedded widget::tree
      - name: Tree Borrows
        run: cargo miri test --lib -- widget::handle widget::embedded widget::tree
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows

  # The browser half (src/web, the wasm examples) is cfg'd out of the Linux
  # build above, so nothing else compiles it. scripts/check-wasm type-checks
  # the library, its features and the four wasm examples.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # An env RUSTFLAGS replaces .cargo/config.toml's rustflags, which is
      # where the wasm target gets web-sys's unstable WebGPU bindings.
      RUSTFLAGS: -D warnings --cfg=web_sys_unstable_apis
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-wasm

  # The AppKit shell (src/mac) and the MoltenVK path, built — and linked — on
  # a real Mac, where on Linux scripts/check-mac can only type-check them. ash
  # loads Vulkan at run time, so the build needs no MoltenVK; the GPU tests
  # skip with a note on a runner without one.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (all targets)
        run: cargo build --all-targets
      - name: Build (all features)
        run: cargo build --lib --all-features
      - name: Test
        run: cargo test
